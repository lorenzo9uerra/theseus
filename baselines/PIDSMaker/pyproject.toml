[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pidsmaker"
version = "4.0.0"
description = "Intrusion detection framework based on deep learning"
authors = [{name="ubc-provenance"}]
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch==1.13.1+cu117",
    "torchvision==0.14.1+cu117",
    "torchaudio==0.13.1",
    "scikit-learn==1.2.0",
    "networkx==2.8.7",
    "xxhash==3.2.0",
    "psutil",
    "scipy==1.10.1",
    "matplotlib==3.8.4",
    "wandb==0.16.6",
    "chardet==5.2.0",
    "nltk==3.8.1",
    "igraph==0.11.5",
    "wget==3.2",
    "torch-geometric==2.5.3",
    "torch-scatter==2.1.1+pt113cu117",
    "gensim==4.3.1",
    "pytz==2024.1",
    "pandas==2.2.2",
    "yacs==0.1.8",
    "numpy==1.26.4",
    "gdown==5.2.0",
    "polars",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pre-commit==4.2.0",
    "mkdocs-material==9.6.12",
    "mkdocs-glightbox==0.4.0",
]

[tool.setuptools]
packages = ["pidsmaker"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-1.13.0+cu117.html"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.ruff]
line-length = 100
indent-width = 4
lint.select = ["W", "I001"]
exclude = [
    ".svg",
    ".ipynb",
    ".json",
    ".csv"
]
lint.isort.known-first-party = ["pidsmaker"]
lint.isort.known-third-party = ["wandb", "torch", "numpy"]
lint.isort.section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
