THEIA_E3:
  name: "theia_e3"
  year_month: "2018-04"
  # Attacks happened in days: 10, 13 (both in T3)
  # In order to stay in T3 and avoid evaluating against distribution shifts,
  # we use days 11 for training, day 10 for validation (as the only other
  # attack happened on this day), and days 12--13 for testing
  train_days: [ 11 ]
  val_days: [ 10 ]
  test_days: [ 12, 13 ]
