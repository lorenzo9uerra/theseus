# Training hyperparameters
num_epochs: 300
patience: 20
sage_lr: 8.7e-5
transformer_lr: 0.0065
sage_weight_decay: 0.3
transformer_weight_decay: 0.0075
sage_dropout: 0.4
transformer_dropout: 0.1
mask_ratio: 0.4

# Model architecture
nhops: 1
node_out_dim: 192
num_heads: 2
embed_dim: 96
num_layers: 1

# Batching and memory management
window_size_minutes: 15 # Snapshot window size in minutes
fuse_edge: true # Whether to fuse multiple consecutive edges between same node pair
max_nodes: 10000 # Sample subgraphs to prevent OOM in Transformer
exclude_malicious_from_training: false # If true, train only on benign-labeled nodes (y==0) within the training split; labels remain causal (attack+contaminated) for thresholding/eval
bidirectional_edges: true # Whether to treat edges as bidirectional
graph_batch_size: 2 # Number of graphs per batch during training
use_fused_edge_count: true # Whether to use fused edge count as edge feature
use_node_degrees: true # Whether to use node degree as node feature

# Word2Vec feature embedding
word2vec:
  emb_dim: 128
  epochs: 50
  alpha: 0.025
  window_size: 5
  min_count: 1
  use_skip_gram: true
  compute_loss: true
  negative: 5
  decline_rate: 30
