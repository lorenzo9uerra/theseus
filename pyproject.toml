[project]
name = "theseus"
version = "0.1.0"
description = "Graph-based Intrusion Detection System for Provenance Graphs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # PyTorch with CUDA 12.8 support
    "torch==2.8.0",
    "triton>=3.4.0",

    # PyTorch Geometric (graph neural networks)
    "torch_geometric==2.6.1",

    # NLP/Embeddings
    "gensim>=4.0.0",

    # Visualization
    "matplotlib>=3.10.7",

    # Timezone handling
    "pytz>=2025.2",

    # Progress bars
    "tqdm>=4.67.1",

    # Experiment tracking
    "wandb>=0.22.2",
    "pydantic>=2.11.0,<2.12.0",

    "scikit-learn==1.7.2",
    "numpy>=1.26.4",
    "polars>=1.30.0",
    "gdown>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

# Ignore specific rules that might be too strict for this project
ignore = [
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = true
# Auto-detect line endings
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma=false
